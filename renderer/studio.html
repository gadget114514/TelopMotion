<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>TelopMotion Studio</title>
<link rel="stylesheet" href="css/studio.css" />
</head>
<body>

<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot-card">
    <div class="boot-brand">TelopMotion <span class="boot-brand-sub">Studio</span><span class="boot-spinner" aria-hidden="true"></span></div>
    <div class="boot-credit">developed by 2nek and SIs</div>
    <div id="boot-status" class="boot-status" data-i18n="studio.boot.loading">Loading TelopMotion…</div>
    <div class="boot-meta"><span id="boot-detail" class="boot-detail" hidden></span><span id="boot-elapsed" class="boot-elapsed">0s</span><span id="boot-percent" class="boot-percent">0%</span></div>
    <div id="boot-bar" class="boot-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="boot-status">
      <div id="boot-fill" class="boot-fill"></div>
    </div>
  </div>
</div>

<div id="studio" class="studio">
  <div id="menubar" class="menubar" role="menubar"></div>

  <aside class="panel media-panel">
    <div class="panel-title" data-i18n="studio.panel.media"></div>
    <div class="panel-body">
      <div class="media-tabs">
        <button id="media-tab-info" class="btn btn-mini is-active" data-i18n="studio.media.tabInfo"></button>
        <button id="media-tab-video" class="btn btn-mini" data-i18n="studio.media.tabVideo"></button>
        <button id="media-tab-audio" class="btn btn-mini" data-i18n="studio.media.tabAudio"></button>
      </div>
      <div id="media-pane-info" class="media-pane">
        <div class="avatar-row">
          <img id="media-avatar" hidden alt="" />
          <div>
            <div id="media-name">—</div>
            <div id="media-handle" class="panel-placeholder"></div>
          </div>
        </div>
        <div class="meta-row"><span data-i18n="studio.panel.songs"></span><strong id="media-songs">0</strong></div>
        <div class="meta-row"><span data-i18n="studio.panel.cues"></span><strong id="media-cues">0</strong></div>
        <div class="meta-row"><span data-i18n="studio.panel.aspect"></span><strong id="media-aspect">16:9</strong></div>
        <div class="meta-row"><span data-i18n="studio.panel.duration"></span><strong id="media-duration">0:00</strong></div>
        <div class="meta-row"><span data-i18n="studio.panel.bpm"></span><strong id="media-bpm">—</strong></div>
      </div>
      <div id="media-pane-video" class="media-pane" hidden>
        <div class="media-actions">
          <button id="media-video-import" class="btn btn-mini" data-i18n="studio.media.importVideo"></button>
          <button id="media-video-clear" class="btn btn-mini" data-i18n="studio.media.clearVideos"></button>
        </div>
        <div id="media-video-list" class="media-list"></div>
      </div>
      <div id="media-pane-audio" class="media-pane" hidden>
        <canvas id="media-audio-canvas" class="media-audio-canvas"></canvas>
        <div id="media-audio-meta" class="panel-placeholder"></div>
        <div class="media-actions">
          <button id="media-audio-import" class="btn btn-mini" data-i18n="studio.media.importAudio"></button>
          <button id="media-audio-remove" class="btn btn-mini" data-i18n="studio.media.removeAudio"></button>
        </div>
      </div>
    </div>
  </aside>
  <div id="split-media" class="splitter-v"></div>

  <main class="preview-panel">
    <div class="preview-stage">
      <div class="preview-frame">
        <canvas id="preview-canvas"></canvas>
        <canvas id="preview-overlay"></canvas>
        <div id="welcome" class="welcome" hidden>
          <h2 data-i18n="studio.welcome.title"></h2>
          <p data-i18n="studio.welcome.body"></p>
          <div class="welcome-actions">
            <button id="welcome-start" class="btn btn-primary" data-i18n="studio.welcome.startEmpty"></button>
            <button id="welcome-lyrics" class="btn" data-i18n="studio.welcome.importLyrics"></button>
            <button id="welcome-open" class="btn" data-i18n="studio.welcome.openProject"></button>
          </div>
        </div>
      </div>
      <div id="preview-warn" class="preview-warn" hidden></div>
      <div id="preview-status" class="preview-status" hidden></div>
    </div>
    <div class="transport">
      <button id="tp-start" class="btn btn-icon" data-i18n-title="studio.transport.start">⏮</button>
      <button id="tp-prev" class="btn btn-icon" data-i18n-title="studio.transport.prevCue">◀◀</button>
      <button id="tp-play" class="btn btn-icon" data-i18n-title="studio.transport.play">▶</button>
      <button id="tp-next" class="btn btn-icon" data-i18n-title="studio.transport.nextCue">▶▶</button>
      <button id="tp-end" class="btn btn-icon" data-i18n-title="studio.transport.end">⏭</button>
      <button id="tp-loop" class="btn btn-icon" data-i18n-title="studio.transport.loop">⟲</button>
      <span id="tp-time" class="time" data-i18n-title="studio.transport.goto">0:00.00 / 0:00.00</span>
      <select id="tp-speed" class="transport-speed" data-i18n-title="studio.transport.speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <button id="tp-aspect" class="btn aspect-badge">16:9</button>
    </div>
  </main>

  <div id="split-inspector" class="splitter-v"></div>
  <aside class="panel inspector-panel">
    <div class="panel-title" data-i18n="studio.panel.inspector"></div>
    <div class="panel-body" id="inspector-body"></div>
  </aside>

  <div id="split-console" class="splitter-v"></div>
  <aside id="preview-console" class="preview-console" hidden></aside>

  <div id="split-timeline" class="splitter-h"></div>
  <section class="timeline-panel">
    <div class="panel-title" data-i18n="studio.panel.timeline"></div>
    <div class="panel-body timeline-body">
      <div class="timeline-head">
        <button id="tl-fit" class="btn btn-mini btn-icon" data-i18n-title="studio.timeline.fit">⤢</button>
        <button id="tl-auto-direct" class="btn btn-mini btn-icon btn-primary" data-i18n-title="studio.timeline.autoDirect">✨</button>
        <button id="tl-vary" class="btn btn-mini btn-icon" data-i18n-title="studio.timeline.vary">🎲</button>
        <button id="tl-reroll-colors" class="btn btn-mini btn-icon" data-i18n-title="studio.timeline.rerollColors">◐</button>
        <button id="tl-theme" class="btn btn-mini btn-icon" data-i18n-title="studio.timeline.theme">🎭</button>
        <span class="timeline-sep" aria-hidden="true"></span>
        <button id="tl-add-text-track" class="btn btn-mini btn-icon" data-i18n-title="studio.timeline.addTextTrackHint">📝</button>
        <button id="tl-add-figure-track" class="btn btn-mini btn-icon" data-i18n-title="studio.timeline.addFigureTrack">⬢</button>
        <button id="tl-add-backdrop-track" class="btn btn-mini btn-icon" data-i18n-title="studio.timeline.addBackdropTrack">🌄</button>
        <button id="tl-add-filler-track" class="btn btn-mini btn-icon" data-i18n-title="studio.timeline.addFillerTrack">🧩</button>
        <button id="tl-add-video-track" class="btn btn-mini btn-icon" data-i18n-title="studio.timeline.addVideoTrack">🎬</button>
        <button id="tl-add-sheet" class="btn btn-mini btn-icon" data-i18n-title="studio.timeline.addSheet">🖼️</button>
        <label class="timeline-zoom">
          <span data-i18n="studio.timeline.zoom"></span>
          <input id="tl-zoom" type="range" min="1" max="800" step="1" value="120" />
          <span id="tl-zoom-label">120 px/s</span>
        </label>
      </div>
      <div id="timeline-scroll" class="timeline-scroll">
        <canvas id="timeline-ruler" class="timeline-ruler"></canvas>
        <canvas id="timeline-canvas"></canvas>
      </div>
      <div id="timeline-hscroll" class="timeline-hscroll" hidden>
        <div id="timeline-hscroll-thumb" class="timeline-hscroll-thumb"></div>
      </div>
    </div>
  </section>
</div>

<div id="toast" class="toast" hidden></div>
<div id="dialog-root" class="dialog-backdrop" hidden></div>
