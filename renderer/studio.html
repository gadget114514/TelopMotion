<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'" />
<title>TelopMotion Studio</title>
<link rel="stylesheet" href="css/studio.css" />
</head>
<body>

<div id="studio" class="studio">
  <div id="menubar" class="menubar" role="menubar"></div>

  <aside class="panel media-panel">
    <div class="panel-title" data-i18n="studio.panel.media"></div>
    <div class="panel-body">
      <div class="media-tabs">
        <button id="media-tab-info" class="btn btn-mini is-active" data-i18n="studio.media.tabInfo"></button>
        <button id="media-tab-video" class="btn btn-mini" data-i18n="studio.media.tabVideo"></button>
        <button id="media-tab-audio" class="btn btn-mini" data-i18n="studio.media.tabAudio"></button>
      </div>
      <div id="media-pane-info" class="media-pane">
        <div class="avatar-row">
          <img id="media-avatar" hidden alt="" />
          <div>
            <div id="media-name">—</div>
            <div id="media-handle" class="panel-placeholder"></div>
          </div>
        </div>
        <div class="meta-row"><span data-i18n="studio.panel.songs"></span><strong id="media-songs">0</strong></div>
        <div class="meta-row"><span data-i18n="studio.panel.cues"></span><strong id="media-cues">0</strong></div>
        <div class="meta-row"><span data-i18n="studio.panel.aspect"></span><strong id="media-aspect">16:9</strong></div>
        <div class="meta-row"><span data-i18n="studio.panel.duration"></span><strong id="media-duration">0:00</strong></div>
      </div>
      <div id="media-pane-video" class="media-pane" hidden>
        <div class="media-actions">
          <button id="media-video-import" class="btn btn-mini" data-i18n="studio.media.importVideo"></button>
        </div>
        <div id="media-video-list" class="media-list"></div>
      </div>
      <div id="media-pane-audio" class="media-pane" hidden>
        <canvas id="media-audio-canvas" class="media-audio-canvas"></canvas>
        <div id="media-audio-meta" class="panel-placeholder"></div>
        <div class="media-actions">
          <button id="media-audio-import" class="btn btn-mini" data-i18n="studio.media.importAudio"></button>
        </div>
      </div>
    </div>
  </aside>
  <div id="split-media" class="splitter-v"></div>

  <main class="preview-panel">
    <div class="preview-stage">
      <div class="preview-frame">
        <canvas id="preview-canvas"></canvas>
        <canvas id="preview-overlay"></canvas>
        <div id="welcome" class="welcome" hidden>
          <h2 data-i18n="studio.welcome.title"></h2>
          <p data-i18n="studio.welcome.body"></p>
          <div class="welcome-actions">
            <button id="welcome-start" class="btn btn-primary" data-i18n="studio.welcome.startEmpty"></button>
            <button id="welcome-lyrics" class="btn" data-i18n="studio.welcome.importLyrics"></button>
            <button id="welcome-open" class="btn" data-i18n="studio.welcome.openProject"></button>
          </div>
        </div>
      </div>
      <div id="preview-warn" class="preview-warn" hidden></div>
      <div id="preview-status" class="preview-status" hidden></div>
    </div>
    <div class="transport">
      <button id="tp-start" class="btn btn-icon" data-i18n-title="studio.transport.start">⏮</button>
      <button id="tp-prev" class="btn btn-icon" data-i18n-title="studio.transport.prevCue">◀◀</button>
      <button id="tp-play" class="btn btn-icon" data-i18n-title="studio.transport.play">▶</button>
      <button id="tp-next" class="btn btn-icon" data-i18n-title="studio.transport.nextCue">▶▶</button>
      <button id="tp-end" class="btn btn-icon" data-i18n-title="studio.transport.end">⏭</button>
      <button id="tp-loop" class="btn btn-icon" data-i18n-title="studio.transport.loop">⟲</button>
      <span id="tp-time" class="time" data-i18n-title="studio.transport.goto">0:00.00 / 0:00.00</span>
      <select id="tp-speed" class="transport-speed" data-i18n-title="studio.transport.speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <button id="tp-aspect" class="btn aspect-badge">16:9</button>
    </div>
  </main>

  <div id="split-inspector" class="splitter-v"></div>
  <aside class="panel inspector-panel">
    <div class="panel-title" data-i18n="studio.panel.inspector"></div>
    <div class="panel-body" id="inspector-body"></div>
  </aside>

  <div id="split-console" class="splitter-v"></div>
  <aside id="preview-console" class="preview-console" hidden></aside>

  <div id="split-timeline" class="splitter-h"></div>
  <section class="timeline-panel">
    <div class="panel-title" data-i18n="studio.panel.timeline"></div>
    <div class="panel-body timeline-body">
      <div class="timeline-head">
        <button id="tl-fit" class="btn btn-mini" data-i18n="studio.timeline.fit"></button>
        <button id="tl-add-cue" class="btn btn-mini" data-i18n="studio.timeline.addCue"></button>
        <button id="tl-restructure" class="btn btn-mini" data-i18n="studio.timeline.restructure"></button>
        <button id="tl-auto-direct" class="btn btn-mini btn-primary" data-i18n="studio.timeline.autoDirect"></button>
        <button id="tl-theme" class="btn btn-mini" data-i18n="studio.timeline.theme"></button>
        <button id="tl-marker" class="btn btn-mini" data-i18n="studio.timeline.marker"></button>
        <select id="tl-prop" class="timeline-prop"></select>
        <button id="tl-add-property" class="btn btn-mini" data-i18n="studio.timeline.addProperty"></button>
        <label class="timeline-zoom">
          <span data-i18n="studio.timeline.zoom"></span>
          <input id="tl-zoom" type="range" min="1" max="800" step="1" value="120" />
          <span id="tl-zoom-label">120 px/s</span>
        </label>
      </div>
      <div id="timeline-scroll" class="timeline-scroll">
        <canvas id="timeline-ruler" class="timeline-ruler"></canvas>
        <canvas id="timeline-canvas"></canvas>
      </div>
      <div id="timeline-hscroll" class="timeline-hscroll" hidden>
        <div id="timeline-hscroll-thumb" class="timeline-hscroll-thumb"></div>
      </div>
    </div>
  </section>
</div>

<div id="toast" class="toast" hidden></div>
<div id="dialog-root" class="dialog-backdrop" hidden></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/studio/fx-strings.js"></script>
<script src="vendor/opentype.min.js"></script>
<script src="vendor/earcut.min.js"></script>
<script src="vendor/mp4-muxer.js"></script>
<script src="vendor/webm-muxer.js"></script>
<script src="vendor/tiny-segmenter.js"></script>
<script src="js/format.js"></script>
<script src="js/platform.js"></script>
<script src="js/srt.js"></script>
<script src="js/lrc.js"></script>
<script src="js/lyrics-json.js"></script>
<script src="js/lyrics-file.js"></script>
<script src="js/color.js"></script>

<script src="js/lyrics/easing.js"></script>
<script src="js/lyrics/tween.js"></script>
<script src="js/lyrics/textflow.js"></script>
<script src="js/lyrics/presets.js"></script>
<script src="js/lyrics/duration.js"></script>
<script src="js/lyrics/fillers.js"></script>
<script src="js/lyrics/filler-render.js"></script>
<script src="js/lyrics/credits.js"></script>
<script src="js/lyrics/audio-analysis.js"></script>
<script src="js/lyrics/audio-driver.js"></script>
<script src="js/lyrics/geometry.js"></script>
<script src="js/lyrics/layout.js"></script>
<script src="js/lyrics/effects/registry.js"></script>
<script src="js/lyrics/effects/animation.js"></script>
<script src="js/lyrics/effects/layout.js"></script>
<script src="js/lyrics/effects/enter.js"></script>
<script src="js/lyrics/effects/exit.js"></script>
<script src="js/lyrics/effects/hold.js"></script>
<script src="js/lyrics/effects/location.js"></script>
<script src="js/lyrics/effects/fill.js"></script>
<script src="js/lyrics/effects/edge.js"></script>
<script src="js/lyrics/effects/post.js"></script>
<script src="js/lyrics/effects/background.js"></script>
<script src="js/lyrics/effects/color.js"></script>
<script src="js/lyrics/effects/text-bg.js"></script>
<script src="js/lyrics/effects/vary.js"></script>
<script src="js/lyrics/motion.js"></script>
<script src="js/lyrics/genres.js"></script>
<script src="js/lyrics/moods.js"></script>
<script src="js/lyrics/random.js"></script>
<script src="js/lyrics/font.js"></script>
<script src="js/lyrics/scene.js"></script>
<script src="js/lyrics/gl/context.js"></script>
<script src="js/lyrics/gl/shaders.js"></script>
<script src="js/lyrics/gl/sdf.js"></script>
<script src="js/lyrics/gl/passes.js"></script>
<script src="js/lyrics/gl/layers.js"></script>
<script src="js/lyrics/gl/shapes.js"></script>
<script src="js/lyrics/engine.js"></script>
<script src="js/lyrics/canvas2d-fallback.js"></script>
<script src="js/studio/project.js"></script>
<script src="js/studio/store.js"></script>
<script src="js/studio/io.js"></script>
<script src="js/studio/menu.js"></script>
<script src="js/studio/preview.js"></script>
<script src="js/studio/timeline.js"></script>
<script src="js/studio/colors.js"></script>
<script src="js/studio/themes.js"></script>

<script src="js/studio/layers-dialog.js"></script>
<script src="js/studio/audio-dialog.js"></script>
<script src="js/studio/credits-dialog.js"></script>
<script src="js/studio/controls.js"></script>
<script src="js/studio/inspector.js"></script>
<script src="js/studio/motion-dialog.js"></script>

<script src="js/video-export.js"></script>

<script src="js/studio/app.js"></script>
</body>
</html>
