# Simple workflow for deploying static content to GitHub Pages
# stable branch -> site root (/TelopMotion/), main branch -> /TelopMotion/dev/
name: Deploy static content to Pages

on:
  # Runs on pushes targeting main (dev) or stable (public)
  push:
    branches: ["main", "stable"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. A newer push cancels the older queued /
# in-progress run so the newest commit always gets deployed (and a stuck run can
# never hold the group while later pushes are dropped).
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable (public)
        uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: stable
          path: stable
      - name: Checkout main (dev)
        uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: main
      - name: Stage public site (stable at root, main at /dev)
        run: |
          rm -rf _site
          mkdir -p _site/dev
          cp stable/index.html _site/index.html
          cp -r stable/renderer _site/renderer
          cp main/index.html _site/dev/index.html
          cp -r main/renderer _site/dev/renderer
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # 56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          # Public web build only: main.js / scripts / doc / data are NOT published.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # 368f82528645a54fb793d4d04e342629a3f51346
