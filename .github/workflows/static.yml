# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. A newer push cancels the older queued /
# in-progress run so the newest commit always gets deployed (and a stuck run can
# never hold the group while later pushes are dropped).
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Pages
        uses: actions/configure-pages@v5 # 983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Stage public site (renderer only)
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -r renderer _site/renderer
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # 56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          # Public web build only: main.js / scripts / doc / data are NOT published.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # 368f82528645a54fb793d4d04e342629a3f51346
